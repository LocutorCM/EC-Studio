name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec-studio-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build EC Studio (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version
          clang++ --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Verify app bundle
        run: test -d "build/ECStudio_artefacts/Release/EC Studio.app"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: EC-Studio-macOS
          path: build/ECStudio_artefacts/Release/EC Studio.app
          if-no-files-found: error
          retention-days: 14
